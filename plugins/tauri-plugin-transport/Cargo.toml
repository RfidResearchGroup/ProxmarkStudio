[package]
name = "tauri-plugin-transport"
version = "0.1.0"
description = "Android USB CDC-ACM and Bluetooth SPP transport bridge for Proxmark Studio"
authors = ["ForestWeave"]
license = "GPL-3.0-or-later"
edition = "2021"
links = "tauri-plugin-transport"
build = "build.rs"

[lib]
name = "tauri_plugin_transport"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
