<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proxmark Studio · Workspace</title>
<style>
:root{color-scheme:dark;--bg:#050810;--panel:#0c1422;--line:#22324a;--text:#dbe7f7;--muted:#7d93b0;--accent:#4cf0c8}
*{box-sizing:border-box}html,body{height:100%;max-width:100%;overflow-x:hidden}body{margin:0;display:flex;flex-direction:column;min-height:100dvh;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;flex:none;min-width:0;max-width:100%;padding:14px 18px;border-bottom:1px solid var(--line);background:#09111d;position:sticky;top:0;z-index:5}
.brand{font-weight:700;letter-spacing:.08em;color:var(--accent);margin-right:6px}
.crumbs{display:flex;align-self:flex-start;align-items:center;gap:2px;flex:0 1 auto;width:fit-content;max-width:min(52rem,70vw);min-width:0;padding:3px;overflow:auto;white-space:nowrap;border:1px solid var(--line);border-radius:8px;background:#0a1421;scrollbar-width:thin}
.crumbs button{flex:none;background:none;border:0;color:var(--muted);padding:5px 8px;border-radius:5px;font-size:12px}.crumbs button:hover{color:var(--text);background:#17273b}.crumbs button.crumb-current{color:var(--accent);background:rgba(76,240,200,.1)}.crumbs button:disabled{opacity:.4;cursor:default}.crumbs .crumb-sep{flex:none;color:var(--faint);font-size:11px}
.toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0;max-width:100%}
.toolbar button,.toolbar select{background:#101c2d;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:6px 9px}
.toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.toolbar button:disabled{opacity:.45;cursor:default}
main{display:flex;flex:1;flex-direction:column;min-height:0;min-width:0;max-width:100%;padding:12px 18px 16px;overflow-x:hidden}
.meta{display:flex;gap:12px;color:var(--muted);font-size:12px;margin:0 0 8px;flex-wrap:wrap;flex:none}
.file-area{position:relative;display:flex;flex:1;flex-direction:column;min-height:0;min-width:0;max-width:100%;padding:8px;overflow-x:hidden;user-select:none;border-radius:12px;transition:background .15s,border-color .15s}
.file-area.dragging{background:#071a1a;box-shadow:inset 0 0 0 1px var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));align-content:start;gap:10px;flex:1;width:100%;min-width:0;max-width:100%}
.list{display:flex;flex-direction:column;align-content:start;gap:4px;flex:1;width:100%;min-width:0;max-width:100%}
.item{position:relative;border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:10px;min-width:0;max-width:100%;cursor:default;transition:border-color .12s,background .12s}
.list .item{display:flex;align-items:center;gap:10px;padding:8px 10px}
.item:hover{border-color:#3b5578}.item.sel{border-color:var(--accent);background:#0d2526}
.item.drop-target{border-color:var(--accent);background:#0e2a29;box-shadow:0 0 0 2px rgba(76,240,200,.2)}
.item .icon{font-size:24px;line-height:1;flex:none}.list .icon{font-size:19px}
.item .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item .sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .name{flex:1}.list .sub{flex:none}
.item .actions{position:absolute;right:6px;top:6px;display:flex;gap:3px}
.actions button{border:1px solid var(--line);background:#0b1524;color:var(--muted);border-radius:5px;padding:3px 5px;font-size:11px}
.grid .item .actions{bottom:6px;top:auto}
.item{display:flex;align-items:center;gap:10px;min-height:64px}
.item>div:not(.icon):not(.actions){flex:1;min-width:0}
.item .icon{order:3;margin-left:auto;font-size:22px}
.item .actions{left:8px;right:auto;bottom:7px;top:auto;order:2;display:none}
.item:hover .actions,.item.sel .actions{display:flex}
.upload-item .icon{order:3;margin-left:auto}
.upload-item{border-style:dashed;color:var(--accent);display:flex;align-items:center;justify-content:center;gap:7px;min-height:82px;background:#0a1b1a;font-weight:600}
.list .upload-item{justify-content:flex-start;min-height:0;padding:10px}
.upload-item:hover{background:#0e2a29;border-color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
#marquee{position:fixed;border:1px solid var(--accent);background:rgba(76,240,200,.12);pointer-events:none;display:none;z-index:9}
#contextmenu{position:fixed;z-index:40;display:none;min-width:190px;padding:5px;border:1px solid var(--line);border-radius:9px;background:#0d1726;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.ctx-item{display:flex;align-items:center;gap:8px;width:100%;padding:8px 9px;border:0;border-radius:6px;background:none;color:var(--text);text-align:left;font-size:12px}.ctx-item:hover{background:#17273b}.ctx-item:disabled{opacity:.4;cursor:default}.ctx-sep{height:1px;margin:4px 3px;background:var(--line)}
.toast{position:fixed;right:18px;bottom:18px;background:#122235;border:1px solid var(--line);border-radius:8px;padding:10px 14px;color:var(--text);max-width:360px;display:none;z-index:50}.toast.err{border-color:#ff6b81;color:#ffb3be}
.dialog-backdrop{position:fixed;inset:0;background:rgba(2,6,12,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:60}
.dialog{width:min(420px,100%);padding:18px;border:1px solid var(--line);border-radius:14px;background:#0c1726;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.dialog h2{margin:0 0 8px;font-size:16px}.dialog p{margin:0 0 12px;color:var(--muted);font-size:12.5px;line-height:1.55}.dialog input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:#07111d;color:var(--text);font:inherit}.dialog__foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.dialog__foot button{padding:7px 12px;border:1px solid var(--line);border-radius:7px;background:#101c2d;color:var(--text)}.dialog__foot .primary{border-color:var(--accent);background:var(--accent);color:#041410;font-weight:700}.dialog__foot .danger{border-color:#ff6b81;color:#ffb3be}
.move-dialog{width:min(560px,100%)}
.move-crumbs{display:flex;align-items:center;gap:3px;flex-wrap:wrap;margin:10px 0;padding:6px;border:1px solid var(--line);border-radius:8px;background:#07111d;font-size:12px}
.move-crumbs button{border:0;background:none;color:var(--muted);padding:3px 5px;border-radius:4px}.move-crumbs button:hover{background:#17273b;color:var(--text)}.move-crumbs .current{color:var(--accent)}
.move-list{display:flex;flex-direction:column;gap:5px;max-height:min(48vh,360px);overflow:auto;margin-bottom:6px;padding:2px}
.move-folder{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--text);text-align:left}.move-folder:hover{border-color:var(--accent);background:#0d2526}.move-folder:disabled{opacity:.35;cursor:not-allowed}.move-folder .arrow{margin-left:auto;color:var(--muted)}.move-empty{padding:20px;text-align:center;color:var(--muted);font-size:12px}.move-note{margin:4px 0 0;color:#ffb3be;font-size:11.5px}
.drop-hint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0d2928;border:1px solid var(--accent);color:var(--accent);border-radius:8px;padding:8px 12px;display:none;z-index:30;font-size:12px;pointer-events:none}
@media(max-width:600px){header{padding:10px}.brand{display:none}.crumbs{flex:0 1 auto;order:2;max-width:calc(100vw - 20px);width:fit-content}main{padding:10px 10px 16px}.file-area{padding:4px}.grid{grid-template-columns:1fr}.item{display:flex;align-items:center;gap:10px;padding:11px 10px}.item>div:not(.icon):not(.actions){flex:1;min-width:0}.item .actions{position:static;display:flex!important;margin-left:auto;padding-left:4px;order:2}.item .icon{order:3}.item .actions button{min-width:28px;min-height:28px}.list .item{padding:9px}.upload-item{min-height:46px;justify-content:flex-start;padding:11px 10px}.toolbar{width:100%;max-width:100%;gap:4px}.toolbar button{flex:1 1 0;padding:6px 7px;min-width:0}.toolbar select{flex:1 1 0;min-width:0}#deleteBtn,#moveBtn{display:none}}
</style>
</head>
<body>
<header>
  <span class="brand">PM3 STUDIO</span>
  <nav class="crumbs" id="crumbs"></nav>
  <div class="toolbar">
    <button id="langBtn">中文</button>
    <button id="layoutBtn">List</button>
    <select id="sort" aria-label="sort"></select>
    <button id="mkdirBtn"></button>
  </div>
</header>
<main id="main">
  <div class="meta"><span id="count"></span><span id="hint"></span></div>
  <div class="file-area" id="area">
    <div id="files" class="grid"></div>
    <div class="empty" id="empty" hidden></div>
  </div>
</main>
<div id="marquee"></div>
<div id="contextmenu"></div>
<div class="dialog-backdrop" id="dialogBackdrop">
  <div class="dialog" role="dialog" aria-modal="true">
    <h2 id="dialogTitle"></h2><p id="dialogBody"></p>
    <input id="dialogInput" autocomplete="off" spellcheck="false" />
    <div class="dialog__foot">
      <button id="dialogCancel"></button>
      <button id="dialogConfirm" class="primary"></button>
    </div>
  </div>
</div>
<div class="dialog-backdrop" id="moveBackdrop">
  <div class="dialog move-dialog" role="dialog" aria-modal="true">
    <h2 id="moveTitle"></h2>
    <div class="move-crumbs" id="moveCrumbs"></div>
    <div class="move-list" id="moveList"></div>
    <div class="dialog__foot">
      <button id="moveCancel"></button>
      <button id="moveConfirm" class="primary" disabled></button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="drop-hint" id="dropHint"></div>
<input id="fileInput" type="file" multiple hidden>
<script>
(() => {
  const messages = {
    en: {
      documentTitle: 'Proxmark Studio · Workspace', workspace: 'Workspace', upload: 'Upload', newFolder: 'New folder',
      delete: 'Delete', move: 'Move', rename: 'Rename', open: 'Open', layout: 'Layout', grid: 'Grid', list: 'List',
      sort: 'Sort', name: 'Name', size: 'Size', modified: 'Modified', empty: 'This folder is empty.',
      filter: 'Filter by file name……', drop: 'Drop files here to upload', dropHere: 'Drop files into this folder',
      uploaded: 'Upload complete', uploadFailed: 'Upload failed', deleteConfirm: 'Delete {name}?',
      deleteSelected: 'Delete {count} selected item(s)?', newFolderPrompt: 'Folder name', renamePrompt: 'New name',
      movePrompt: 'Move {count} selected item(s) to folder path', root: 'Workspace', working: 'Working…',
      invalidTarget: 'Invalid destination.', items: '{count} items', hint: 'Right-click for more actions · Ctrl/⌘ click or drag to select',
      overwrite: 'Some files already exist. Overwrite them?', folder: 'Folder', noAccess: 'Not available',
      layoutGrid: 'Switch to grid layout', layoutList: 'Switch to list layout', copied: 'Copied', up: 'Up one level',
      cancel: 'Cancel', confirm: 'Confirm', deleteTitle: 'Delete', renameTitle: 'Rename', moveTitle: 'Move', newFolderTitle: 'New folder', uploadTitle: 'Upload', moveHere: 'Move here',
      noFolders: 'No subfolders here', moveBlocked: 'A folder cannot be moved inside itself or one of its subfolders.', moving: 'Moving…'
    },
    zh: {
      documentTitle: 'Proxmark Studio · 工作区', workspace: '工作区', upload: '上传', newFolder: '新建文件夹',
      delete: '删除', move: '移动', rename: '重命名', open: '打开', layout: '排版', grid: '网格', list: '列表',
      sort: '排序', name: '名称', size: '大小', modified: '修改时间', empty: '此文件夹为空。',
      filter: '按文件名筛选……', drop: '拖拽文件到此处上传', dropHere: '松开鼠标，上传到此文件夹',
      uploaded: '上传完成', uploadFailed: '上传失败', deleteConfirm: '删除“{name}”？',
      deleteSelected: '删除选中的 {count} 项？', newFolderPrompt: '文件夹名称', renamePrompt: '新名称',
      movePrompt: '将选中的 {count} 项移动到文件夹路径', root: '工作区', working: '处理中……',
      invalidTarget: '目标位置无效。', items: '{count} 项', hint: '右键更多操作 · Ctrl/⌘ 点击或拖动框选',
      overwrite: '部分文件已存在，是否覆盖？', folder: '文件夹', noAccess: '不可用',
      layoutGrid: '切换为网格排版', layoutList: '切换为列表排版', copied: '已复制', up: '返回上一级',
      cancel: '取消', confirm: '确定', deleteTitle: '删除', renameTitle: '重命名', moveTitle: '移动', newFolderTitle: '新建文件夹', uploadTitle: '上传', moveHere: '移动到这里',
      noFolders: '这里没有子文件夹', moveBlocked: '不能把文件夹移动到自身或其子文件夹中。', moving: '移动中……'
    }
  };
  const state = { path: '', entries: [], selected: new Set(), layout: 'grid', sort: 'name', context: null, dragPath: '', moveSource: '' };
  let lang = localStorage.getItem('pm3-http-lang') || ((navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en');
  if (!messages[lang]) lang = 'en';
  const $ = (id) => document.getElementById(id);
  const token = new URLSearchParams(location.search).get('token') || '';
  const t = (key, vars) => { let text = messages[lang][key] || messages.en[key] || key; if (vars) for (const [name, value] of Object.entries(vars)) text = text.replaceAll(`{${name}}`, value); return text; };
  const api = (path, options) => { const url = new URL(path, location.origin); url.searchParams.set('token', token); return fetch(url, options); };
  const fmt = (n) => { if (n < 1024) return n + ' B'; if (n < 1048576) return (n / 1024).toFixed(1) + ' KB'; return (n / 1048576).toFixed(1) + ' MB'; };
  const parent = (p) => p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '';
  const join = (p, name) => p ? p + '/' + name : name;
  const toast = (text, err) => { const el = $('toast'); el.textContent = text; el.className = 'toast' + (err ? ' err' : ''); el.style.display = 'block'; clearTimeout(toast.timer); toast.timer = setTimeout(() => el.style.display = 'none', 4200); };
  let dialogResolve = null;
  function closeDialog(value) {
    const resolve = dialogResolve; dialogResolve = null;
    $('dialogBackdrop').style.display = 'none';
    resolve?.(value);
  }
  function askDialog({ title, body = '', input = false, value = '', confirmText = t('confirm'), danger = false }) {
    if (dialogResolve) closeDialog(null);
    return new Promise((resolve) => {
      dialogResolve = resolve;
      $('dialogTitle').textContent = title;
      $('dialogBody').textContent = body;
      $('dialogBody').style.display = body ? 'block' : 'none';
      const field = $('dialogInput');
      field.style.display = input ? 'block' : 'none';
      field.value = value;
      $('dialogCancel').textContent = t('cancel');
      $('dialogConfirm').textContent = confirmText;
      $('dialogConfirm').className = danger ? 'danger' : 'primary';
      $('dialogBackdrop').style.display = 'flex';
      if (input) { setTimeout(() => { field.focus(); field.select(); }, 30); }
    });
  }
  const askText = (title, value = '') => askDialog({ title, input: true, value });
  const askConfirm = (title, body = '', danger = false) => askDialog({ title, body, danger });

  const moveState = { sources: [], target: '', folders: [], busy: false };
  function moveTargetInvalid(target) {
    return moveState.sources.some((source) => target === source || target.startsWith(source + '/'));
  }
  function moveTargetNoop(target) {
    return moveState.sources.every((source) => target === parent(source));
  }
  function renderMoveDialog() {
    $('moveTitle').textContent = t('moveTitle') + ' · ' + moveState.sources.length;
    const crumbs = $('moveCrumbs'); crumbs.innerHTML = '';
    const up = document.createElement('button'); up.textContent = '↑'; up.title = t('up'); up.disabled = !moveState.target; up.onclick = () => loadMoveFolders(parent(moveState.target)); crumbs.append(up);
    const rootBtn = document.createElement('button'); rootBtn.textContent = t('root'); rootBtn.className = moveState.target ? '' : 'current'; rootBtn.onclick = () => loadMoveFolders(''); crumbs.append(rootBtn);
    let acc = ''; const parts = moveState.target.split('/').filter(Boolean);
    parts.forEach((part, index) => {
      acc = join(acc, part); const target = acc;
      const sep = document.createElement('span'); sep.textContent = '/'; sep.className = 'crumb-sep'; crumbs.append(sep);
      const b = document.createElement('button'); b.textContent = part; b.className = index === parts.length - 1 ? 'current' : ''; b.onclick = () => loadMoveFolders(target); crumbs.append(b);
    });
    const list = $('moveList'); list.innerHTML = '';
    if (!moveState.folders.length) { const empty = document.createElement('div'); empty.className = 'move-empty'; empty.textContent = t('noFolders'); list.append(empty); }
    moveState.folders.forEach((folder) => {
      const button = document.createElement('button'); button.className = 'move-folder';
      button.disabled = moveTargetInvalid(folder.path);
      button.innerHTML = `<span>📁</span><span>${folder.name}</span><span class="arrow">›</span>`;
      button.onclick = () => loadMoveFolders(folder.path); list.append(button);
    });
    const invalid = moveTargetInvalid(moveState.target) || moveTargetNoop(moveState.target);
    const note = document.createElement('p'); note.className = 'move-note'; note.textContent = invalid ? t('moveBlocked') : '';
    list.append(note);
    const confirm = $('moveConfirm'); confirm.textContent = moveState.busy ? t('moving') : t('moveHere'); confirm.disabled = moveState.busy || invalid;
  }
  async function loadMoveFolders(path) {
    moveState.target = path;
    try {
      const res = await api('/api/list?path=' + encodeURIComponent(path));
      const data = await res.json();
      if (!res.ok) return toast(data.error || t('uploadFailed'), true);
      moveState.folders = (data.entries || []).filter((entry) => entry.isDir);
    } catch (error) {
      moveState.folders = []; toast(String(error || t('uploadFailed')), true);
    }
    renderMoveDialog();
  }
  async function openMoveDialog(entry) {
    const sources = state.selected.size > 1 && state.selected.has(entry.path) ? [...state.selected] : [entry.path];
    if (!sources.length) return;
    moveState.sources = sources; moveState.target = ''; moveState.folders = []; moveState.busy = false;
    $('moveCancel').textContent = t('cancel');
    $('moveBackdrop').style.display = 'flex';
    await loadMoveFolders('');
  }
  async function closeMoveDialog() {
    if (moveState.busy) return;
    $('moveBackdrop').style.display = 'none';
  }
  async function confirmMoveDialog() {
    if (moveState.busy || moveTargetInvalid(moveState.target) || moveTargetNoop(moveState.target)) return;
    moveState.busy = true; renderMoveDialog();
    try {
      for (const source of moveState.sources) {
        if (moveState.target === parent(source)) continue;
        const res = await api('/api/move', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ source, target: moveState.target, name: source.split('/').pop() }) });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) toast(data.error || t('uploadFailed'), true);
      }
      $('moveBackdrop').style.display = 'none'; await load();
    } finally {
      moveState.busy = false; renderMoveDialog();
    }
  }

  const syncChrome = () => {
    document.title = t('documentTitle'); $('langBtn').textContent = lang === 'en' ? '中文' : 'EN';
    $('layoutBtn').textContent = state.layout === 'grid' ? t('list') : t('grid');
    $('layoutBtn').title = state.layout === 'grid' ? t('layoutList') : t('layoutGrid');
    $('sort').innerHTML = `<option value="name">${t('name')}</option><option value="size">${t('size')}</option><option value="modified">${t('modified')}</option>`;
    $('sort').value = state.sort;
    $('mkdirBtn').textContent = t('newFolder');
    $('dropHint').textContent = t('drop'); $('hint').textContent = t('hint'); $('empty').textContent = t('empty');
    $('fileInput').setAttribute('aria-label', t('upload'));
  };
  async function load(path = state.path) {
    const res = await api('/api/list?path=' + encodeURIComponent(path));
    const data = await res.json();
    if (!res.ok) return toast(data.error || t('uploadFailed'), true);
    state.path = path; state.entries = data.entries || []; state.selected.clear();
    render();
  }
  function sorted() {
    const list = [...state.entries];
    list.sort((a, b) => {
      if (a.isDir !== b.isDir) return a.isDir ? -1 : 1;
      let r = state.sort === 'size' ? a.size - b.size : state.sort === 'modified' ? a.modified - b.modified : a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
      return r;
    });
    return list;
  }
  function makeItem(entry) {
    const node = document.createElement('div');
    node.className = 'item' + (state.selected.has(entry.path) ? ' sel' : '');
    node.dataset.path = entry.path; node.dataset.dir = entry.isDir ? '1' : '';
    node.draggable = true;
    node.addEventListener('dragstart', (e) => {
      if (!e.dataTransfer) return;
      state.moveSource = entry.path;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('application/x-pm3-move', entry.path);
      e.dataTransfer.setData('text/plain', entry.path);
    });
    node.addEventListener('dragend', () => { state.moveSource = ''; clearDropTarget(); });
    node.innerHTML = `<div class="icon">${entry.isDir ? '📁' : '📄'}</div><div style="min-width:0"><div class="name"></div><div class="sub"></div></div><div class="actions"><button data-act="download">↓</button><button data-act="rename">✎</button><button data-act="delete">✕</button></div>`;
    node.querySelector('.name').textContent = entry.name;
    node.querySelector('.sub').textContent = entry.isDir ? t('folder') : fmt(entry.size);
    node.addEventListener('click', (e) => {
      if (e.button !== 0 || e.target.closest('.actions')) return;
      if (e.ctrlKey || e.metaKey || e.shiftKey) { state.selected.has(entry.path) ? state.selected.delete(entry.path) : state.selected.add(entry.path); render(); return; }
      state.selected.clear();
      if (entry.isDir) { load(entry.path); return; }
      state.selected.add(entry.path); render();
    });
    node.addEventListener('dblclick', () => entry.isDir ? load(entry.path) : download(entry));
    node.addEventListener('contextmenu', (e) => { e.preventDefault(); e.stopPropagation(); if (!state.selected.has(entry.path)) { state.selected.clear(); state.selected.add(entry.path); render(); } openContext(e.clientX, e.clientY, entry); });
    node.querySelector('[data-act="download"]').onclick = (e) => { e.stopPropagation(); entry.isDir ? toast(t('noAccess')) : download(entry); };
    node.querySelector('[data-act="rename"]').onclick = (e) => { e.stopPropagation(); rename(entry); };
    node.querySelector('[data-act="delete"]').onclick = (e) => { e.stopPropagation(); remove(entry); };
    node.addEventListener('dragenter', (e) => { if (!entry.isDir) return; e.preventDefault(); clearDropTarget(); node.classList.add('drop-target'); state.dragPath = entry.path; $('dropHint').textContent = state.moveSource ? t('moveHere') : t('dropHere'); });
    node.addEventListener('dragover', (e) => { if (entry.isDir) e.preventDefault(); });
    return node;
  }
  function uploadTile() {
    const node = document.createElement('button');
    node.type = 'button'; node.className = 'item upload-item'; node.dataset.upload = '1';
    node.innerHTML = `<span class="icon">＋</span><span class="name">${t('upload')}</span>`;
    node.onclick = () => $('fileInput').click();
    return node;
  }
  function render() {
    const files = $('files'); files.className = state.layout;
    $('empty').hidden = state.entries.length > 0;
    $('count').textContent = t('items', { count: state.entries.length });
    $('layoutBtn').textContent = state.layout === 'grid' ? t('list') : t('grid');
    const crumbs = $('crumbs'); crumbs.innerHTML = ''; crumbs.title = '/' + state.path;
    const up = document.createElement('button'); up.className = 'crumb-up'; up.textContent = '↑'; up.title = t('up'); up.disabled = !state.path; up.onclick = () => load(parent(state.path)); crumbs.append(up);
    const rootBtn = document.createElement('button'); rootBtn.textContent = t('root'); rootBtn.className = state.path ? '' : 'crumb-current'; rootBtn.onclick = () => load(''); crumbs.append(rootBtn);
    let acc = '';
    const parts = state.path.split('/').filter(Boolean);
    parts.forEach((part, index) => { acc = join(acc, part); const target = acc; const sep = document.createElement('span'); sep.className = 'crumb-sep'; sep.textContent = '/'; crumbs.append(sep); const b = document.createElement('button'); b.textContent = part; b.className = index === parts.length - 1 ? 'crumb-current' : ''; b.onclick = () => load(target); crumbs.append(b); });
    files.innerHTML = '';
    sorted().forEach((entry) => files.append(makeItem(entry)));
    files.append(uploadTile());
    syncChrome();
  }
  function download(entry) { const a = document.createElement('a'); a.href = '/api/download?path=' + encodeURIComponent(entry.path) + '&token=' + encodeURIComponent(token); a.download = entry.name; document.body.append(a); a.click(); a.remove(); }
  async function remove(entry) {
    const entries = entry ? [entry] : [...state.selected].map((path) => ({ path, name: path.split('/').pop() }));
    if (!entries.length) return;
    const ok = await askConfirm(t('deleteTitle'), entries.length === 1 ? t('deleteConfirm', { name: entries[0].name }) : t('deleteSelected', { count: entries.length }), true);
    if (!ok) return;
    for (const item of entries) await api('/api/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: item.path }) });
    await load();
  }
  async function rename(entry) {
    const name = await askText(t('renameTitle'), entry.name); if (!name || name === entry.name) return;
    const res = await api('/api/move', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ source: entry.path, target: parent(entry.path), name }) });
    const data = await res.json(); if (!res.ok) return toast(data.error || t('uploadFailed'), true); await load();
  }
  async function mkdir() {
    const name = await askText(t('newFolderTitle')); if (!name) return;
    const res = await api('/api/mkdir', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ parent: state.path, name }) });
    const data = await res.json(); if (!res.ok) return toast(data.error || t('uploadFailed'), true); await load();
  }
  let uploadBusy = false;
  async function upload(files, overwrite = false, target = state.path) {
    if (!files.length || uploadBusy) return;
    uploadBusy = true;
    let overwriteAll = overwrite;
    let uploaded = 0;
    const send = async (file, allowOverwrite) => {
      const form = new FormData();
      form.append('files', file, file.name);
      return api('/api/upload?path=' + encodeURIComponent(target) + '&overwrite=' + (allowOverwrite ? '1' : '0'), { method: 'POST', body: form });
    };
    try {
      for (const file of files) {
        let res = await send(file, overwriteAll);
        if (res.status === 409 && !overwriteAll) {
          if (await askConfirm(t('uploadTitle'), t('overwrite'))) {
            overwriteAll = true;
            res = await send(file, true);
          } else {
            continue;
          }
        }
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { toast(data.error || t('uploadFailed'), true); break; }
        uploaded++;
      }
      if (uploaded) toast(t('uploaded'));
      await load();
    } catch (error) {
      toast(String(error || t('uploadFailed')), true);
    } finally {
      uploadBusy = false;
    }
  }
  async function batchMove() {
    if (!state.selected.size) return;
    const entry = { path: [...state.selected][0] };
    await openMoveDialog(entry);
  }
  function openContext(x, y, entry) {
    state.context = entry || null;
    const menu = $('contextmenu'); menu.innerHTML = '';
    const add = (label, action, disabled = false) => { const b = document.createElement('button'); b.className = 'ctx-item'; b.textContent = label; b.disabled = disabled; b.onclick = () => { closeContext(); action(); }; menu.append(b); };
    if (entry?.isDir) add(t('open'), () => load(entry.path));
    add(t('upload'), () => $('fileInput').click());
    add(t('newFolder'), mkdir);
    if (entry) {
      add(t('rename'), () => rename(entry));
      add(t('move'), () => openMoveDialog(entry));
      add(t('delete'), () => remove(state.selected.size > 1 ? null : entry));
      menu.append(Object.assign(document.createElement('div'), { className: 'ctx-sep' }));
    }
    add(t('layout') + ': ' + (state.layout === 'grid' ? t('grid') : t('list')), () => { state.layout = state.layout === 'grid' ? 'list' : 'grid'; render(); });
    add(t('sort') + ': ' + t('name'), () => { state.sort = 'name'; render(); });
    add(t('sort') + ': ' + t('size'), () => { state.sort = 'size'; render(); });
    add(t('sort') + ': ' + t('modified'), () => { state.sort = 'modified'; render(); });
    menu.style.display = 'block'; menu.style.left = Math.min(x, window.innerWidth - 210) + 'px'; menu.style.top = Math.min(y, window.innerHeight - menu.offsetHeight - 8) + 'px';
  }
  function closeContext() { $('contextmenu').style.display = 'none'; }
  function clearDropTarget() { document.querySelectorAll('.item.drop-target').forEach((node) => node.classList.remove('drop-target')); state.dragPath = ''; $('dropHint').style.display = 'none'; }
  let dragDepth = 0;
  const area = $('area');
  area.addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; area.classList.add('dragging'); $('dropHint').textContent = t('drop'); $('dropHint').style.display = 'block'; });
  async function moveItemTo(source, target) {
    if (source === target || target === parent(source)) return;
    const res = await api('/api/move', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ source, target, name: source.split('/').pop() }) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) return toast(data.error || t('uploadFailed'), true);
    await load();
  }
  area.addEventListener('dragover', (e) => { e.preventDefault(); if (!state.dragPath) $('dropHint').textContent = state.moveSource ? t('moveHere') : t('drop'); });
  area.addEventListener('dragleave', (e) => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; area.classList.remove('dragging'); clearDropTarget(); } });
  area.addEventListener('drop', (e) => { e.preventDefault(); const target = state.dragPath || state.path; const moveSource = state.moveSource; state.moveSource = ''; dragDepth = 0; area.classList.remove('dragging'); clearDropTarget(); if (moveSource) { void moveItemTo(moveSource, target); return; } upload([...e.dataTransfer.files], false, target); });
  area.addEventListener('contextmenu', (e) => { e.preventDefault(); state.selected.clear(); render(); openContext(e.clientX, e.clientY, null); });
  window.addEventListener('click', () => closeContext());
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeContext(); });
  window.addEventListener('scroll', () => closeContext(), true);
  $('fileInput').onchange = (e) => { const files = [...e.target.files]; e.target.value = ''; upload(files); };
  $('layoutBtn').onclick = () => { state.layout = state.layout === 'grid' ? 'list' : 'grid'; render(); };
  $('sort').onchange = (e) => { state.sort = e.target.value; render(); };
  $('mkdirBtn').onclick = mkdir;
  $('langBtn').onclick = () => { lang = lang === 'en' ? 'zh' : 'en'; localStorage.setItem('pm3-http-lang', lang); document.documentElement.lang = lang; render(); };
  $('dialogCancel').onclick = () => closeDialog(null);
  $('dialogConfirm').onclick = () => { const field = $('dialogInput'); closeDialog(field.style.display === 'none' ? true : field.value); };
  $('dialogBackdrop').addEventListener('mousedown', (e) => { if (e.target === e.currentTarget) closeDialog(null); });
  $('moveCancel').onclick = closeMoveDialog;
  $('moveConfirm').onclick = confirmMoveDialog;
  $('moveBackdrop').addEventListener('mousedown', (e) => { if (e.target === e.currentTarget) closeMoveDialog(); });
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('moveBackdrop').style.display === 'flex') { closeMoveDialog(); return; } if (!dialogResolve) return; if (e.key === 'Escape') closeDialog(null); if (e.key === 'Enter') { const field = $('dialogInput'); closeDialog(field.style.display === 'none' ? true : field.value); } });
  const drag = { active: false, x: 0, y: 0, frame: 0 };
  area.addEventListener('mousedown', (e) => { if (e.button !== 0 || e.target.closest('.item') || window.matchMedia('(pointer: coarse)').matches) return; drag.active = true; drag.x = e.clientX; drag.y = e.clientY; state.selected.clear(); document.querySelectorAll('.item.sel').forEach((node) => node.classList.remove('sel')); });
  window.addEventListener('mousemove', (e) => {
    if (!drag.active || drag.frame) return;
    drag.frame = requestAnimationFrame(() => {
      drag.frame = 0;
      const box = $('marquee'); const left = Math.min(drag.x, e.clientX), top = Math.min(drag.y, e.clientY), right = Math.max(drag.x, e.clientX), bottom = Math.max(drag.y, e.clientY);
      box.style.cssText = `display:block;left:${left}px;top:${top}px;width:${right - left}px;height:${bottom - top}px`;
      document.querySelectorAll('.item[data-path]').forEach((node) => {
        const r = node.getBoundingClientRect(); const hit = r.left < right && r.right > left && r.top < bottom && r.bottom > top;
        if (hit) state.selected.add(node.dataset.path); else state.selected.delete(node.dataset.path);
        node.classList.toggle('sel', hit);
      });
    });
  });
  window.addEventListener('mouseup', () => { drag.active = false; if (drag.frame) cancelAnimationFrame(drag.frame); drag.frame = 0; $('marquee').style.display = 'none'; });
  document.documentElement.lang = lang; load('');
})();
</script>
