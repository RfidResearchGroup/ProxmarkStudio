name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  desktop:
    name: Desktop / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-gnu
            toolchain: stable-x86_64-pc-windows-gnu
            msystem: UCRT64
            host_bin: ucrt64\bin
            target_bin: ucrt64\bin
            plugin_bin: ucrt64\bin
            msys_packages: >-
              mingw-w64-ucrt-x86_64-bzip2
              mingw-w64-ucrt-x86_64-cmake
              mingw-w64-ucrt-x86_64-gcc
              mingw-w64-ucrt-x86_64-lz4
              mingw-w64-ucrt-x86_64-ninja
              mingw-w64-ucrt-x86_64-pkgconf
              mingw-w64-ucrt-x86_64-zlib
              make
              tar
            bundles: nsis
            artifact: ProxmarkStudio-windows-x64
            paths: |
              src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/*.exe
              src-tauri/target/x86_64-pc-windows-gnu/release/ProxmarkStudio-windows-x64-portable.zip
          - name: windows-x86
            os: windows-latest
            target: i686-pc-windows-gnu
            toolchain: stable-x86_64-pc-windows-gnu
            msystem: UCRT64
            host_bin: ucrt64\bin
            target_bin: mingw32\bin
            plugin_bin: mingw32\bin
            msys_packages: >-
              mingw-w64-ucrt-x86_64-cmake
              mingw-w64-ucrt-x86_64-gcc
              mingw-w64-ucrt-x86_64-ninja
              mingw-w64-ucrt-x86_64-pkgconf
              mingw-w64-i686-bzip2
              mingw-w64-i686-gcc
              mingw-w64-i686-lz4
              mingw-w64-i686-zlib
              make
              tar
            bundles: nsis
            artifact: ProxmarkStudio-windows-x86
            paths: |
              src-tauri/target/i686-pc-windows-gnu/release/bundle/nsis/*.exe
              src-tauri/target/i686-pc-windows-gnu/release/ProxmarkStudio-windows-x86-portable.zip
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            toolchain: stable
            bundles: app
            artifact: ProxmarkStudio-macos-x64
            paths: src-tauri/target/x86_64-apple-darwin/release/ProxmarkStudio-macos-x64.dmg
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            toolchain: stable
            bundles: app
            artifact: ProxmarkStudio-macos-arm64
            paths: src-tauri/target/aarch64-apple-darwin/release/ProxmarkStudio-macos-arm64.dmg
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            toolchain: stable
            bundles: appimage,deb
            artifact: ProxmarkStudio-linux-x64
            paths: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libudev-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config \
            zlib1g-dev

      - name: Set up MSYS2 toolchain
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: ${{ matrix.msys_packages }}

      - name: Put MSYS2 on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs['msys2-location'] }}\${{ matrix.host_bin }}" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "${{ steps.msys2.outputs['msys2-location'] }}\${{ matrix.target_bin }}" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "${{ steps.msys2.outputs['msys2-location'] }}\usr\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Select MinGW host compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $host = "${{ steps.msys2.outputs['msys2-location'] }}\${{ matrix.host_bin }}"
          $target = "${{ steps.msys2.outputs['msys2-location'] }}\${{ matrix.target_bin }}"
          $usr = "${{ steps.msys2.outputs['msys2-location'] }}\usr\bin"
          "PATH=$host;$target;$usr;$env:PATH" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Set up Proxmark3 plugin (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PM3X_MINGW_BIN: ${{ steps.msys2.outputs['msys2-location'] }}\${{ matrix.plugin_bin }}
        run: ./scripts/setup-plugin.ps1

      - name: Set up Proxmark3 plugin (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/setup-plugin.sh

      - name: Build
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
          PM3X_MINGW_BIN: ${{ steps.msys2.outputs['msys2-location'] }}\${{ matrix.plugin_bin }}
        run: |
          pnpm tauri build \
            --target "${{ matrix.target }}" \
            --bundles "${{ matrix.bundles }}"

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          target="${{ matrix.target }}"
          app="$(find "src-tauri/target/$target/release/bundle/macos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          dmg="src-tauri/target/$target/release/ProxmarkStudio-${{ matrix.name }}.dmg"
          for attempt in 1 2 3; do
            rm -f "$dmg"
            if hdiutil create -volname "Proxmark Studio" -srcfolder "$app" -ov -format UDZO "$dmg"; then
              exit 0
            fi
            echo "hdiutil create failed (attempt $attempt); detaching and retrying"
            hdiutil detach "/Volumes/Proxmark Studio" -force || true
            sleep 5
          done
          exit 1

      - name: Package portable Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $release = "src-tauri/target/${{ matrix.target }}/release"
          Compress-Archive -Force `
            -Path "$release/proxmark-studio.exe", "$release/WebView2Loader.dll" `
            -DestinationPath "$release/ProxmarkStudio-${{ matrix.name }}-portable.zip"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android / universal
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-36
            build-tools;36.0.0
            ndk;27.2.12479018

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Set NDK path
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Proxmark3 plugin
        shell: bash
        run: bash scripts/setup-plugin.sh

      - name: Build APK
        shell: bash
        run: |
          for target in aarch64 armv7 i686 x86_64; do
            pnpm tauri android build \
              --debug \
              --apk \
              --target "$target" \
              --ci \
              --ignore-version-mismatches
          done
          cd src-tauri/gen/android
          ./gradlew :app:packageUniversalDebug -x rustBuildUniversalDebug --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p artifacts
          APK="src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          test -f "$APK"
          cp "$APK" artifacts/ProxmarkStudio-android-universal-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProxmarkStudio-android-universal
          path: artifacts/ProxmarkStudio-android-universal-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release assets
    if: github.event_name != 'pull_request'
    needs:
      - desktop
      - android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true

      - name: Publish rolling latest build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Latest development build
          body: |
            Automated package built from `${{ github.sha }}` on `${{ github.ref_name }}`.

            Includes Windows, macOS, Linux, and Android artifacts.
          prerelease: true
          make_latest: false
          files: release-assets/**/*
